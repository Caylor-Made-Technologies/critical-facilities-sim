<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="g" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1e6fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1e6fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect id="tile" width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <!-- Circuit ring: power side (blue, left) and cooling side (cyan, right), with trace nodes -->
  <g fill="none" stroke-linecap="round" stroke-width="22">
    <path d="M256 92 A164 164 0 0 0 256 420" stroke="#3d8bff"/>
    <path d="M256 92 A164 164 0 0 1 256 420" stroke="#22d3ee"/>
  </g>
  <!-- gaps where traces leave the ring -->
  <g fill="#0b111b">
    <circle cx="256" cy="92" r="20"/>
    <circle cx="256" cy="420" r="20"/>
  </g>
  <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 92 V48 H312" stroke="#22d3ee"/>
    <path d="M256 420 V464 H200" stroke="#3d8bff"/>
  </g>
  <g>
    <circle cx="256" cy="92" r="15" fill="#e8f4ff"/>
    <circle cx="256" cy="420" r="15" fill="#e8f4ff"/>
    <circle cx="326" cy="48" r="13" fill="#22d3ee"/>
    <circle cx="186" cy="464" r="13" fill="#3d8bff"/>
  </g>
  <!-- Bolt -->
  <path d="M284 128 L176 280 H246 L222 386 L338 222 H264 Z" fill="#1e6fff" filter="url(#soft)" opacity="0.9"/>
  <path d="M284 128 L176 280 H246 L222 386 L338 222 H264 Z" fill="url(#g)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
</svg>
