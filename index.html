<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Interactive simulator of generic data center power, cooling, redundancy and safety. Free and offline. Built by Caylor Made Technologies." />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="/critical-facilities-sim/favicon.ico" sizes="any" />
    <link rel="icon" href="/critical-facilities-sim/favicon-32.png" type="image/png" />
    <link rel="manifest" href="/critical-facilities-sim/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/critical-facilities-sim/apple-touch-icon.png" />
    <link rel="preload" href="/critical-facilities-sim/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Critical Facilities Simulator</title>
  </head>
  <body>
    <!-- Brand intro: painted before the app's code arrives; the app removes it. -->
    <div class="splash" id="boot" aria-hidden="true">
      <div class="splash-inner">
        <img src="/critical-facilities-sim/brand/app-mark.png" alt="" width="84" height="84" />
        <svg class="splash-trace" viewBox="0 0 300 40" focusable="false">
          <path d="M0 20H90L105 8H195L210 20H300" />
          <path class="splash-spark" d="M0 20H90L105 8H195L210 20H300" />
        </svg>
        <span class="splash-word"><span>C</span><span>A</span><span>Y</span><span>L</span><span>O</span><span>R</span><span>&nbsp;</span><span>M</span><span>A</span><span>D</span><span>E</span></span>
        <span class="splash-tag">Advanced Engineering. Built Different.</span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>This simulator needs JavaScript. Nothing is sent anywhere; it runs entirely in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
